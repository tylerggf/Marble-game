<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race ULTIMATE</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE</h2>
  <div id="buttons"></div>
  <h3 id="status">Pick a marble to start</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selected = null;
let marbles = [];
let obstacles = [];
let particles = [];
let state = "waiting";
let winnerLocked = false;
let restartTimeout = null;

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    let laneObs = [];
    let count = Math.floor(Math.random()*3)+1;
    for(let j=0;j<count;j++){
      // Generate random unique positions for each lane's obstacles
      laneObs.push(250 + j*220 + Math.random()*120);
    }
    obstacles.push(laneObs);
  }
}

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=40;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/40;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,3,3);
    ctx.globalAlpha=1;
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    // Slight speed variation ensures marbles don't stay perfectly synced
    this.speed=2.6 + Math.random() * 0.5;
    this.slow=0;

    this.trail=[];
    this.finished=false;

    this.spin=0;
    this.prevX=this.x;
  }

  update(){

    if(state!=="running") return;
    if(this.finished || winnerLocked) return;

    this.prevX=this.x;

    let sp=this.speed;

    if(this.slow>0){
      sp*=0.4;
      this.slow--;
    }

    this.x+=sp;

    // REALISTIC ROLLING
    this.spin += (this.x - this.prevX) * 0.12;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>12) this.trail.shift();

    // OBSTACLES
    const laneObs = obstacles[this.i] || [];
    laneObs.forEach(ox => {
      if(Math.abs(this.x-ox)<10 && this.slow===0){
        // Randomize recovery time slightly
        this.slow=80 + Math.floor(Math.random()*30);
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    });

    // FINISH
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      this.finished=true;
      state="finished";

      if (this.i === selected) {
        status.innerText = "YOU WIN! " + NAMES[this.i] + " finished first!";
        status.style.color = "#3bff7a"; // Green for win
      } else {
        status.innerText = "YOU LOSE! " + NAMES[this.i] + " finished first!";
        status.style.color = "#ff3b3b"; // Red for loss
      }

      // Reset after 3 seconds to let player pick again
      restartTimeout = setTimeout(() => {
        resetGame();
      }, 3000);
    }
  }

  draw(){

    // trail glow
    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha=i/this.trail.length*0.3;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,5,5);
    }

    ctx.globalAlpha=1;

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.spin);

    // Draw a highlight ring if this is the player's selected marble
    if (this.i === selected) {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
      ctx.lineWidth = 3;
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.stroke();
    }

    // glow
    ctx.shadowBlur=18;
    ctx.shadowColor=COLORS[this.i];

    let r=14;

    let g=ctx.createRadialGradient(-5,-5,2,0,0,r);
    g.addColorStop(0,"#fff");
    g.addColorStop(0.3,COLORS[this.i]);
    g.addColorStop(1,"#000");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // reflection
    ctx.strokeStyle="rgba(255,255,255,0.35)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(-3,-3,r*0.6,0,Math.PI);
    ctx.stroke();

    ctx.restore();

    ctx.shadowBlur=0;
  }
}

// =========================
// TRACK (REALISTIC)
// =========================

function drawTrack(){

  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0f18");
  g.addColorStop(1,"#04060a");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){

    let y=120+i*60;

    // lane glow
    ctx.save();
    ctx.strokeStyle=COLORS[i];
    ctx.globalAlpha=0.15;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
    ctx.restore();

    // texture
    ctx.save();
    ctx.fillStyle=COLORS[i];
    ctx.globalAlpha=0.04;
    for(let x=0;x<W;x+=35){
      ctx.fillRect(x,y-1,2,2);
    }
    ctx.restore();

    // obstacles (3D metal)
    const laneObs = obstacles[i] || [];
    laneObs.forEach(ox => {
      ctx.fillStyle="rgba(0,0,0,0.4)";
      ctx.fillRect(ox+2,y-8,26,26);

      let g2=ctx.createLinearGradient(ox,y,ox+20,y+20);
      g2.addColorStop(0,"#777");
      g2.addColorStop(0.5,"#bbb");
      g2.addColorStop(1,"#444");

      ctx.fillStyle=g2;
      ctx.fillRect(ox,y-10,24,24);

      ctx.strokeStyle="rgba(255,255,255,0.2)";
      ctx.strokeRect(ox,y-10,24,24);
    });
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

function resetGame() {
  state = "waiting";
  selected = null;
  status.innerText = "Pick a marble to start";
  status.style.color = "white";

  // Re-enable and reset buttons
  Array.from(buttons.children).forEach(btn => {
    btn.style.opacity = "1";
    btn.style.borderColor = "transparent";
    btn.style.transform = "scale(1)";
  });
  setup();
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";
    b.style.border="2px solid transparent";
    b.style.transition="all 0.2s";
    b.onclick=()=>{
      // If a race is running, don't allow switching
      if (state === "running") return;

      // If we were waiting for an auto-restart, cancel that timer
      // because the player is making a manual choice now.
      if (restartTimeout) clearTimeout(restartTimeout);

      selected=i;
      // Update status text to show choice
      status.innerText="You picked: " + NAMES[i];
      status.style.color=COLORS[i];
      // Highlight the clicked button and reset others
      Array.from(buttons.children).forEach((btn, idx) => {
        btn.style.borderColor = (idx === i) ? "white" : "transparent";
        btn.style.transform = (idx === i) ? "scale(1.3)" : "scale(1)";
        btn.style.opacity = "1";
      });

      startGame();
    };
    buttons.appendChild(b);
  });
}

// =========================
// START
// =========================

function startGame(){

  if(selected===null){
    status.innerText="Pick a marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="RACING...";
  status.style.color = "white";

  // Visually lock the selection buttons
  Array.from(buttons.children).forEach(btn => btn.style.opacity = "0.5");
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);
  drawTrack();

  // Update marbles - stop immediately if a winner is found
  if (state === "running") {
    for (let i = 0; i < marbles.length; i++) {
      marbles[i].update();
      if (winnerLocked) break; 
    }
  }

  marbles.forEach(m=>m.draw());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
