<!-- =========================
MARBLE RACE PRO+ ENGINE CORE
SECTION 1: SYSTEM + PHYSICS + STATE
========================= -->

<script>
// ======================================================
// GLOBAL GAME CONFIG
// ======================================================

const GAME_CONFIG = {
  canvasWidth: 1000,
  canvasHeight: 600,

  laneCount: 7,
  maxObstaclesPerLane: 3,

  marbleRadius: 14,

  baseSpeedMin: 2.0,
  baseSpeedMax: 3.6,

  obstacleSlowFactor: 0.28,

  finishLinePadding: 90,

  particleLimit: 300,

  debug: false
};

// ======================================================
// CANVAS SETUP
// ======================================================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = GAME_CONFIG.canvasWidth;
canvas.height = GAME_CONFIG.canvasHeight;

// ======================================================
// GAME STATE MANAGER
// ======================================================

const GameState = {
  WAITING: "waiting",
  RUNNING: "running",
  FINISHED: "finished"
};

let currentState = GameState.WAITING;

// ======================================================
// CORE DATA STRUCTURES
// ======================================================

let selectedMarble = null;

let marbles = [];
let obstacles = [];
let particles = [];

let raceStartTime = 0;
let raceEndTime = 0;

let globalSlowMotion = 1;

// ======================================================
// COLOR SYSTEM (future shader upgrade ready)
// ======================================================

const MARBLE_COLORS = [
  "#ff3b3b",
  "#3b7bff",
  "#3bff7a",
  "#ffe93b",
  "#b23bff",
  "#ff8c3b",
  "#ffffff"
];

// ======================================================
// UTILITY FUNCTIONS
// ======================================================

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

// ======================================================
// PARTICLE SYSTEM (CORE)
// ======================================================

class Particle {
  constructor(x, y, color, intensity = 1) {
    this.x = x;
    this.y = y;

    this.vx = (Math.random() - 0.5) * 3 * intensity;
    this.vy = (Math.random() - 0.5) * 3 * intensity;

    this.life = randInt(30, 60);
    this.maxLife = this.life;

    this.color = color;
    this.size = rand(1.5, 3.5);
  }

  update() {
    this.x += this.vx * globalSlowMotion;
    this.y += this.vy * globalSlowMotion;

    this.vx *= 0.96;
    this.vy *= 0.96;

    this.life--;
  }

  draw() {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }

  isDead() {
    return this.life <= 0;
  }
}

// ======================================================
// OBSTACLE SYSTEM (DATA ONLY)
// ======================================================

class LaneObstacles {
  constructor(laneId) {
    this.laneId = laneId;
    this.count = randInt(0, GAME_CONFIG.maxObstaclesPerLane);
    this.positions = [];

    this.generatePositions();
  }

  generatePositions() {
    for (let i = 0; i < this.count; i++) {
      this.positions.push({
        x: 300 + i * 120,
        type: randInt(0, 2),
        active: true
      });
    }
  }

  getPenalty() {
    return this.count * GAME_CONFIG.obstacleSlowFactor;
  }
}

// ======================================================
// MARBLE PHYSICS SYSTEM
// ======================================================

class Marble {
  constructor(id, laneY) {
    this.id = id;

    this.x = 60;
    this.y = laneY;

    this.vx = 0;
    this.ax = 0;

    this.baseSpeed = rand(
      GAME_CONFIG.baseSpeedMin,
      GAME_CONFIG.baseSpeedMax
    );

    this.finished = false;
    this.finishTime = 0;

    this.trail = [];

    this.glow = 0;
    this.wobble = rand(0, Math.PI * 2);

    this.lanePenalty = 0;
  }

  applyPhysics() {
    if (currentState !== GameState.RUNNING) return;
    if (this.finished) return;

    const penalty = obstacles[this.id].getPenalty();
    const targetSpeed = this.baseSpeed - penalty;

    this.ax = (targetSpeed - this.vx) * 0.08;
    this.vx += this.ax;

    this.vx = clamp(this.vx, 0, 6);

    this.x += this.vx * globalSlowMotion;

    this.wobble += 0.1;

    // trail system
    this.trail.push({ x: this.x, y: this.y });

    if (this.trail.length > 10) {
      this.trail.shift();
    }

    // finish condition
    if (this.x >= GAME_CONFIG.canvasWidth - GAME_CONFIG.finishLinePadding) {
      this.finishRace();
    }
  }

  finishRace() {
    if (this.finished) return;

    this.finished = true;
    this.finishTime = performance.now();

    this.triggerFinishParticles();

    globalSlowMotion = 0.35;
  }

  triggerFinishParticles() {
    for (let i = 0; i < 25; i++) {
      particles.push(
        new Particle(this.x, this.y, MARBLE_COLORS[this.id], 1.5)
      );
    }
  }

  drawTrail() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];

      ctx.globalAlpha = i / this.trail.length * 0.4;
      ctx.fillStyle = MARBLE_COLORS[this.id];

      ctx.beginPath();
      ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  drawBody() {
    const r = GAME_CONFIG.marbleRadius + Math.sin(this.wobble) * 1.5;

    ctx.shadowBlur = 18;
    ctx.shadowColor = MARBLE_COLORS[this.id];

    const grad = ctx.createRadialGradient(
      this.x - 5,
      this.y - 5,
      2,
      this.x,
      this.y,
      r
    );

    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, MARBLE_COLORS[this.id]);
    grad.addColorStop(1, "#000000");

    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }

  draw() {
    this.drawTrail();
    this.drawBody();
  }
}

// ======================================================
// RACE ENGINE (CORE CONTROL)
// ======================================================

class RaceEngine {
  constructor() {
    this.lanes = [];
    this.marbles = [];
  }

  init() {
    this.createLanes();
    this.createMarbles();
  }

  createLanes() {
    obstacles = [];

    for (let i = 0; i < GAME_CONFIG.laneCount; i++) {
      obstacles.push(new LaneObstacles(i));
    }
  }

  createMarbles() {
    marbles = [];

    for (let i = 0; i < GAME_CONFIG.laneCount; i++) {
      const y = 120 + i * 60;
      marbles.push(new Marble(i, y));
    }
  }

  update() {
    if (currentState !== GameState.RUNNING) return;

    marbles.forEach(m => m.applyPhysics());

    particles.forEach(p => p.update());

    particles = particles.filter(p => !p.isDead());

    this.checkRaceEnd();
  }

  checkRaceEnd() {
    const allFinished = marbles.every(m => m.finished);

    if (allFinished && currentState === GameState.RUNNING) {
      currentState = GameState.FINISHED;
      raceEndTime = performance.now();

      globalSlowMotion = 1;
    }
  }
}

// ======================================================
// GLOBAL ENGINE INSTANCE
// ======================================================

const engine = new RaceEngine();

engine.init();

// ======================================================
// STATE CONTROL FUNCTIONS
// ======================================================

function startRace() {
  if (selectedMarble === null) return;

  engine.init();

  currentState = GameState.RUNNING;
  raceStartTime = performance.now();

  globalSlowMotion = 1;
}

function pickMarble(id) {
  selectedMarble = id;
}

// ======================================================
// DEBUG EXPORT (for later sections)
// ======================================================

window._ENGINE = {
  engine,
  GameState,
  startRace,
  pickMarble,
  marbles,
  obstacles,
  particles
};

</script>
