<!-- =========================
MARBLE RACE PRO+ ENGINE CORE
SECTION 1: SYSTEM + PHYSICS + STATE
========================= -->

<script>
// ======================================================
// GLOBAL GAME CONFIG
// ======================================================

const GAME_CONFIG = {
  canvasWidth: 1000,
  canvasHeight: 600,

  laneCount: 7,
  maxObstaclesPerLane: 3,

  marbleRadius: 14,

  baseSpeedMin: 2.0,
  baseSpeedMax: 3.6,

  obstacleSlowFactor: 0.28,

  finishLinePadding: 90,

  particleLimit: 300,

  debug: false
};

// ======================================================
// CANVAS SETUP
// ======================================================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = GAME_CONFIG.canvasWidth;
canvas.height = GAME_CONFIG.canvasHeight;

// ======================================================
// GAME STATE MANAGER
// ======================================================

const GameState = {
  WAITING: "waiting",
  RUNNING: "running",
  FINISHED: "finished"
};

let currentState = GameState.WAITING;

// ======================================================
// CORE DATA STRUCTURES
// ======================================================

let selectedMarble = null;

let marbles = [];
let obstacles = [];
let particles = [];

let raceStartTime = 0;
let raceEndTime = 0;

let globalSlowMotion = 1;

// ======================================================
// COLOR SYSTEM (future shader upgrade ready)
// ======================================================

const MARBLE_COLORS = [
  "#ff3b3b",
  "#3b7bff",
  "#3bff7a",
  "#ffe93b",
  "#b23bff",
  "#ff8c3b",
  "#ffffff"
];

// ======================================================
// UTILITY FUNCTIONS
// ======================================================

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

// ======================================================
// PARTICLE SYSTEM (CORE)
// ======================================================

class Particle {
  constructor(x, y, color, intensity = 1) {
    this.x = x;
    this.y = y;

    this.vx = (Math.random() - 0.5) * 3 * intensity;
    this.vy = (Math.random() - 0.5) * 3 * intensity;

    this.life = randInt(30, 60);
    this.maxLife = this.life;

    this.color = color;
    this.size = rand(1.5, 3.5);
  }

  update() {
    this.x += this.vx * globalSlowMotion;
    this.y += this.vy * globalSlowMotion;

    this.vx *= 0.96;
    this.vy *= 0.96;

    this.life--;
  }

  draw() {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }

  isDead() {
    return this.life <= 0;
  }
}

// ======================================================
// OBSTACLE SYSTEM (DATA ONLY)
// ======================================================

class LaneObstacles {
  constructor(laneId) {
    this.laneId = laneId;
    this.count = randInt(0, GAME_CONFIG.maxObstaclesPerLane);
    this.positions = [];

    this.generatePositions();
  }

  generatePositions() {
    for (let i = 0; i < this.count; i++) {
      this.positions.push({
        x: 300 + i * 120,
        type: randInt(0, 2),
        active: true
      });
    }
  }

  getPenalty() {
    return this.count * GAME_CONFIG.obstacleSlowFactor;
  }
}

// ======================================================
// MARBLE PHYSICS SYSTEM
// ======================================================

class Marble {
  constructor(id, laneY) {
    this.id = id;

    this.x = 60;
    this.y = laneY;

    this.vx = 0;
    this.ax = 0;

    this.baseSpeed = rand(
      GAME_CONFIG.baseSpeedMin,
      GAME_CONFIG.baseSpeedMax
    );

    this.finished = false;
    this.finishTime = 0;

    this.trail = [];

    this.glow = 0;
    this.wobble = rand(0, Math.PI * 2);

    this.lanePenalty = 0;
  }

  applyPhysics() {
    if (currentState !== GameState.RUNNING) return;
    if (this.finished) return;

    const penalty = obstacles[this.id].getPenalty();
    const targetSpeed = this.baseSpeed - penalty;

    this.ax = (targetSpeed - this.vx) * 0.08;
    this.vx += this.ax;

    this.vx = clamp(this.vx, 0, 6);

    this.x += this.vx * globalSlowMotion;

    this.wobble += 0.1;

    // trail system
    this.trail.push({ x: this.x, y: this.y });

    if (this.trail.length > 10) {
      this.trail.shift();
    }

    // finish condition
    if (this.x >= GAME_CONFIG.canvasWidth - GAME_CONFIG.finishLinePadding) {
      this.finishRace();
    }
  }

  finishRace() {
    if (this.finished) return;

    this.finished = true;
    this.finishTime = performance.now();

    this.triggerFinishParticles();

    globalSlowMotion = 0.35;
  }

  triggerFinishParticles() {
    for (let i = 0; i < 25; i++) {
      particles.push(
        new Particle(this.x, this.y, MARBLE_COLORS[this.id], 1.5)
      );
    }
  }

  drawTrail() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];

      ctx.globalAlpha = i / this.trail.length * 0.4;
      ctx.fillStyle = MARBLE_COLORS[this.id];

      ctx.beginPath();
      ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  drawBody() {
    const r = GAME_CONFIG.marbleRadius + Math.sin(this.wobble) * 1.5;

    ctx.shadowBlur = 18;
    ctx.shadowColor = MARBLE_COLORS[this.id];

    const grad = ctx.createRadialGradient(
      this.x - 5,
      this.y - 5,
      2,
      this.x,
      this.y,
      r
    );

    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, MARBLE_COLORS[this.id]);
    grad.addColorStop(1, "#000000");

    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }

  draw() {
    this.drawTrail();
    this.drawBody();
  }
}

// ======================================================
// RACE ENGINE (CORE CONTROL)
// ======================================================

class RaceEngine {
  constructor() {
    this.lanes = [];
    this.marbles = [];
  }

  init() {
    this.createLanes();
    this.createMarbles();
  }

  createLanes() {
    obstacles = [];

    for (let i = 0; i < GAME_CONFIG.laneCount; i++) {
      obstacles.push(new LaneObstacles(i));
    }
  }

  createMarbles() {
    marbles = [];

    for (let i = 0; i < GAME_CONFIG.laneCount; i++) {
      const y = 120 + i * 60;
      marbles.push(new Marble(i, y));
    }
  }

  update() {
    if (currentState !== GameState.RUNNING) return;

    marbles.forEach(m => m.applyPhysics());

    particles.forEach(p => p.update());

    particles = particles.filter(p => !p.isDead());

    this.checkRaceEnd();
  }

  checkRaceEnd() {
    const allFinished = marbles.every(m => m.finished);

    if (allFinished && currentState === GameState.RUNNING) {
      currentState = GameState.FINISHED;
      raceEndTime = performance.now();

      globalSlowMotion = 1;
    }
  }
}

// ======================================================
// GLOBAL ENGINE INSTANCE
// ======================================================

const engine = new RaceEngine();

engine.init();

// ======================================================
// STATE CONTROL FUNCTIONS
// ======================================================

function startRace() {
  if (selectedMarble === null) return;

  engine.init();

  currentState = GameState.RUNNING;
  raceStartTime = performance.now();

  globalSlowMotion = 1;
}

function pickMarble(id) {
  selectedMarble = id;
}

// ======================================================
// DEBUG EXPORT (for later sections)
// ======================================================

window._ENGINE = {
  engine,
  GameState,
  startRace,
  pickMarble,
  marbles,
  obstacles,
  particles
};

</script>
<!-- =========================
PART 2: UI + GAME FLOW SYSTEM
HOOKS INTO ENGINE (PART 1)
========================= -->

<script>

// ======================================================
// UI STATE SYSTEM
// ======================================================

const UIState = {
  MENU: "menu",
  COUNTDOWN: "countdown",
  RACING: "racing",
  RESULTS: "results"
};

let currentUI = UIState.MENU;

// ======================================================
// UI ELEMENTS (dynamic overlay system)
// ======================================================

const UI = {
  statusText: null,
  buttonsContainer: null,
  countdown: 0,
  countdownActive: false,
  winnerFlash: 0
};

// ======================================================
// INITIALIZE UI
// ======================================================

function initUI() {
  UI.statusText = document.getElementById("status");
  UI.buttonsContainer = document.getElementById("buttons");

  createMarbleButtons();
  setUIState(UIState.MENU);
}

// ======================================================
// CREATE MARBLE SELECTION BUTTONS
// ======================================================

function createMarbleButtons() {
  UI.buttonsContainer.innerHTML = "";

  for (let i = 0; i < MARBLE_COLORS.length; i++) {
    const btn = document.createElement("button");

    btn.style.background = MARBLE_COLORS[i];
    btn.style.width = "35px";
    btn.style.height = "35px";
    btn.style.borderRadius = "6px";

    btn.onclick = () => selectMarble(i);

    btn.addEventListener("mouseenter", () => {
      btn.style.transform = "scale(1.2)";
    });

    btn.addEventListener("mouseleave", () => {
      btn.style.transform = "scale(1)";
    });

    UI.buttonsContainer.appendChild(btn);
  }
}

// ======================================================
// MARBLE SELECTION SYSTEM
// ======================================================

function selectMarble(id) {
  pickMarble(id);

  UI.statusText.innerText =
    "Selected: Marble " + (id + 1);

  flashSelection(id);
}

function flashSelection(id) {
  UI.winnerFlash = 10;
}

// ======================================================
// RACE START FLOW (WITH COUNTDOWN)
// ======================================================

function startRaceFlow() {
  if (selectedMarble === null) {
    UI.statusText.innerText = "Pick a marble first!";
    return;
  }

  setUIState(UIState.COUNTDOWN);

  UI.countdown = 3;
  UI.countdownActive = true;

  runCountdown();
}

function runCountdown() {
  if (UI.countdown <= 0) {
    startActualRace();
    return;
  }

  UI.statusText.innerText = "Starting in " + UI.countdown;

  setTimeout(() => {
    UI.countdown--;
    runCountdown();
  }, 800);
}

function startActualRace() {
  startRace(); // from ENGINE (PART 1)

  setUIState(UIState.RACING);

  UI.statusText.innerText = "RACE STARTED!";
}

// ======================================================
// UI STATE MANAGEMENT
// ======================================================

function setUIState(state) {
  currentUI = state;
}

// ======================================================
// RENDER UI OVERLAY ON CANVAS
// ======================================================

function drawUIOverlay() {
  if (currentUI === UIState.COUNTDOWN) {
    drawCountdown();
  }

  if (currentUI === UIState.RESULTS) {
    drawResultsScreen();
  }

  if (UI.winnerFlash > 0) {
    UI.winnerFlash--;
  }
}

// ======================================================
// COUNTDOWN VISUAL
// ======================================================

function drawCountdown() {
  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 80px Arial";
  ctx.textAlign = "center";

  ctx.fillText(UI.countdown, W/2, H/2);

  ctx.restore();
}

// ======================================================
// RESULTS SCREEN
// ======================================================

function drawResultsScreen() {
  const winner = getWinner();

  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = MARBLE_COLORS[winner.id];
  ctx.font = "bold 50px Arial";
  ctx.textAlign = "center";

  ctx.fillText("WINNER!", W/2, H/2 - 40);

  ctx.fillStyle = "#fff";
  ctx.font = "30px Arial";

  ctx.fillText(
    "Marble " + (winner.id + 1),
    W/2,
    H/2 + 20
  );

  if (selectedMarble === winner.id) {
    ctx.fillStyle = "#00ff88";
    ctx.fillText("YOU WON!", W/2, H/2 + 80);
  } else {
    ctx.fillStyle = "#ff4444";
    ctx.fillText("YOU LOST", W/2, H/2 + 80);
  }

  ctx.restore();
}

// ======================================================
// WINNER CALCULATION
// ======================================================

function getWinner() {
  return [...marbles].sort(
    (a,b) => a.finishTime - b.finishTime
  )[0];
}

// ======================================================
// MAIN GAME LOOP EXTENSION
// ======================================================

function gameLoopExtension() {
  drawUIOverlay();

  if (currentUI === UIState.FINISHED) {
    setUIState(UIState.RESULTS);
  }

  requestAnimationFrame(gameLoopExtension);
}

// ======================================================
// CONNECT TO ENGINE UPDATE LOOP
// ======================================================

function updateGame() {
  engine.update();

  if (engine.marbles.every(m => m.finished)) {
    setUIState(UIState.FINISHED);
  }

  requestAnimationFrame(updateGame);
}

// ======================================================
// INPUT HOOKS
// ======================================================

document.addEventListener("keydown", (e) => {
  if (e.key === " ") {
    startRaceFlow();
  }
});

// ======================================================
// BOOT SYSTEM
// ======================================================

window.addEventListener("load", () => {
  initUI();

  updateGame();
  gameLoopExtension();
});

// ======================================================
// GLOBAL EXPORT (for debugging)
// ======================================================

window._UI = {
  UI,
  setUIState,
  startRaceFlow,
  selectMarble
};

</script>
