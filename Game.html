<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race LOBBY SYSTEM</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE LOBBY RACE</h2>

  <input id="codeInput" placeholder="Enter lobby code">
  <button onclick="submitCode()">Join</button>

  <div id="buttons"></div>
  <button onclick="startRaceFlow()">START</button>

  <h3 id="status">Enter Code to Play</h3>

  <button onclick="generateCode()">ADMIN: Generate Code</button>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.95);
display:none;
z-index:9999;
padding:20px;
overflow:auto;
">
<h2>ADMIN PANEL</h2>
<button onclick="closeAdmin()">Close</button>
<div id="history"></div>
</div>

<script>

// =========================
// CORE STATE
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selectedMarble = null;
let marbles = [];
let obstacles = [];
let particles = [];

let state = "waiting";
let winnerLocked = false;

// =========================
// LOBBY CODE SYSTEM
// =========================

let validCodes = JSON.parse(localStorage.getItem("validCodes") || "[]");
let usedCodes = JSON.parse(localStorage.getItem("usedCodes") || "[]");
let activeCode = null;

// =========================
// WIN HISTORY
// =========================

let winHistory = JSON.parse(localStorage.getItem("winHistory") || "[]");

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=50;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/50;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,2,2);
    ctx.globalAlpha=1;
  }

  dead(){ return this.life<=0; }
}

// =========================
// CODE SYSTEM
// =========================

function generateCode(){
  let code = Math.floor(100000 + Math.random()*900000).toString();

  validCodes.push(code);
  localStorage.setItem("validCodes", JSON.stringify(validCodes));

  prompt("ONE-TIME LOBBY CODE:", code);
}

function submitCode(){

  let input = document.getElementById("codeInput").value;

  if(usedCodes.includes(input)){
    status.innerText = "❌ Code already used";
    return;
  }

  if(!validCodes.includes(input)){
    status.innerText = "❌ Invalid code";
    return;
  }

  activeCode = input;
  status.innerText = "✅ Code accepted";
}

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4));
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.baseSpeed=2.8;
    this.slowTimer=0;

    this.finished=false;
  }

  hitObstacle(){
    this.slowTimer=120;
    particles.push(new Particle(this.x,this.y,COLORS[this.i]));
  }

  update(){

    if(state!=="running") return;
    if(this.finished) return;

    let speed=this.baseSpeed;

    if(this.slowTimer>0){
      speed*=0.45;
      this.slowTimer--;
    }

    this.x+=speed;

    // OBSTACLES
    for(let j=0;j<obstacles[this.i];j++){
      let ox=380+j*180;

      if(Math.abs(this.x-ox)<10 && this.slowTimer===0){
        this.hitObstacle();
      }
    }

    // WIN
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      this.finished=true;
      state="finished";

      // MARK CODE USED
      usedCodes.push(activeCode);
      validCodes = validCodes.filter(c => c !== activeCode);

      localStorage.setItem("usedCodes", JSON.stringify(usedCodes));
      localStorage.setItem("validCodes", JSON.stringify(validCodes));

      // WIN LOG
      winHistory.push({
        winner: NAMES[this.i],
        color: COLORS[this.i],
        code: activeCode,
        time: new Date().toLocaleString()
      });

      localStorage.setItem("winHistory", JSON.stringify(winHistory));

      status.innerText = "WINNER: " + NAMES[this.i];
    }
  }

  draw(){
    ctx.fillStyle=COLORS[this.i];
    ctx.beginPath();
    ctx.arc(this.x,this.y,14,0,Math.PI*2);
    ctx.fill();
  }
}

// =========================
// GAME FLOW
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

function startRaceFlow(){

  if(!activeCode){
    status.innerText="Enter lobby code first!";
    return;
  }

  if(!selectedMarble){
    status.innerText="Pick marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="GO!";
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";

    b.onclick=()=>selectedMarble=i;

    buttons.appendChild(b);
  });
}

// =========================
// ADMIN PANEL (HIDDEN)
// =========================

let buffer="";

document.addEventListener("keydown",(e)=>{
  buffer+=e.key.toLowerCase();
  if(buffer.length>10) buffer=buffer.slice(-10);

  if(buffer.includes("admin")){
    openAdmin();
    buffer="";
  }
});

function openAdmin(){
  const panel=document.getElementById("adminPanel");
  const hist=document.getElementById("history");

  hist.innerHTML="";

  winHistory.forEach((w,i)=>{
    let div=document.createElement("div");
    div.innerHTML=`
      #${i+1}<br>
      Winner: ${w.winner}<br>
      Code: ${w.code}<br>
      Time: ${w.time}<br><hr>
    `;
    hist.appendChild(div);
  });

  panel.style.display="block";
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  marbles.forEach(m=>{
    m.update();
    m.draw();
  });

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.dead()) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// START
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
