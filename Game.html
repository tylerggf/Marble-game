<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race ULTIMATE</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE</h2>
  <div id="buttons"></div>
  <button onclick="startGame()">START</button>
  <h3 id="status">Pick a marble</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selected = null;
let marbles = [];
let obstacles = [];
let particles = [];
let state = "waiting";
let winnerLocked = false;

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*3)+1);
  }
}

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=40;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/40;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,3,3);
    ctx.globalAlpha=1;
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.speed=2.8;
    this.slow=0;

    this.trail=[];
    this.finished=false;

    this.spin=0;
    this.prevX=this.x;
  }

  update(){

    if(state!=="running") return;
    if(this.finished || winnerLocked) return;

    this.prevX=this.x;

    let sp=this.speed;

    if(this.slow>0){
      sp*=0.4;
      this.slow--;
    }

    this.x+=sp;

    // REALISTIC ROLLING
    this.spin += (this.x - this.prevX) * 0.12;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>12) this.trail.shift();

    // OBSTACLES
    for(let j=0;j<obstacles[this.i];j++){
      let ox=300+j*200;

      if(Math.abs(this.x-ox)<10 && this.slow===0){
        this.slow=90;
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    }

    // FINISH
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      this.finished=true;
      state="finished";

      status.innerText="WINNER: "+NAMES[this.i];
    }
  }

  draw(){

    // trail glow
    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha=i/this.trail.length*0.3;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,5,5);
    }

    ctx.globalAlpha=1;

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.spin);

    // glow
    ctx.shadowBlur=18;
    ctx.shadowColor=COLORS[this.i];

    let r=14;

    let g=ctx.createRadialGradient(-5,-5,2,0,0,r);
    g.addColorStop(0,"#fff");
    g.addColorStop(0.3,COLORS[this.i]);
    g.addColorStop(1,"#000");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // reflection
    ctx.strokeStyle="rgba(255,255,255,0.35)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(-3,-3,r*0.6,0,Math.PI);
    ctx.stroke();

    ctx.restore();

    ctx.shadowBlur=0;
  }
}

// =========================
// TRACK (REALISTIC)
// =========================

function drawTrack(){

  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0f18");
  g.addColorStop(1,"#04060a");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){

    let y=120+i*60;

    // lane glow
    ctx.strokeStyle="rgba(120,180,255,0.12)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    // texture
    for(let x=0;x<W;x+=35){
      ctx.fillStyle="rgba(255,255,255,0.02)";
      ctx.fillRect(x,y-1,2,2);
    }

    // obstacles (3D metal)
    for(let j=0;j<obstacles[i];j++){
      let ox=300+j*200;

      ctx.fillStyle="rgba(0,0,0,0.4)";
      ctx.fillRect(ox+2,y-8,26,26);

      let g2=ctx.createLinearGradient(ox,y,ox+20,y+20);
      g2.addColorStop(0,"#777");
      g2.addColorStop(0.5,"#bbb");
      g2.addColorStop(1,"#444");

      ctx.fillStyle=g2;
      ctx.fillRect(ox,y-10,24,24);

      ctx.strokeStyle="rgba(255,255,255,0.2)";
      ctx.strokeRect(ox,y-10,24,24);
    }
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";
    b.onclick=()=>selected=i;
    buttons.appendChild(b);
  });
}

// =========================
// START
// =========================

function startGame(){

  if(selected===null){
    status.innerText="Pick a marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="RACING...";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  drawTrack();

  marbles.forEach(m=>m.update());
  marbles.forEach(m=>m.draw());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
