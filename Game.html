<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race FIXED</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE</h2>

  <div id="buttons"></div>

  <button onclick="startGame()">START</button>

  <h3 id="status">Pick a marble</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// CANVAS
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

// =========================
// STATE
// =========================

let selected = null;
let marbles = [];
let obstacles = [];
let particles = [];
let state = "waiting";
let winnerLocked = false;

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*3)+1);
  }
}

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=40;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/40;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,3,3);
    ctx.globalAlpha=1;
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.speed=2.8;
    this.slow=0;
    this.trail=[];
    this.finished=false;
  }

  update(){

    if(state!=="running") return;
    if(this.finished || winnerLocked) return;

    let sp=this.speed;

    if(this.slow>0){
      sp*=0.4;
      this.slow--;
    }

    this.x+=sp;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10) this.trail.shift();

    // obstacles
    for(let j=0;j<obstacles[this.i];j++){
      let ox=300+j*200;

      if(Math.abs(this.x-ox)<10 && this.slow===0){
        this.slow=90;
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    }

    // WIN
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      this.finished=true;
      state="finished";

      status.innerText="WINNER: "+NAMES[this.i];
    }
  }

  draw(){

    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha=i/this.trail.length*0.4;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,5,5);
    }

    ctx.globalAlpha=1;

    ctx.fillStyle=COLORS[this.i];
    ctx.beginPath();
    ctx.arc(this.x,this.y,14,0,Math.PI*2);
    ctx.fill();
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";

    b.onclick=()=>selected=i;

    buttons.appendChild(b);
  });
}

// =========================
// START GAME
// =========================

function startGame(){

  if(selected===null){
    status.innerText="Pick a marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="RACING...";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  marbles.forEach(m=>m.update());
  marbles.forEach(m=>m.draw());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
