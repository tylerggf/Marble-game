<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race PRO+ FULL</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

canvas {
  display: block;
  margin: auto;
}
</style>
</head>

<body>

<div id="ui">
  <h2>Pick Your Marble</h2>
  <div id="buttons"></div>
  <button onclick="startRaceFlow()">START</button>
  <h3 id="status">Ready</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// CORE SETUP
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];

// =========================
// GAME STATE SYSTEM
// =========================

const GameState = {
  WAITING:"waiting",
  RUNNING:"running",
  FINISHED:"finished"
};

const UIState = {
  MENU:"menu",
  COUNTDOWN:"countdown",
  RACING:"racing",
  RESULTS:"results"
};

let currentState = GameState.WAITING;
let currentUI = UIState.MENU;

// =========================
// GLOBAL VARIABLES
// =========================

let selectedMarble = null;
let marbles = [];
let obstacles = [];
let particles = [];

let speedLines = [];

let globalSlowMotion = 1;

// =========================
// UTIL
// =========================

const rand = (a,b)=>Math.random()*(b-a)+a;

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=50;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/50;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,2,2);
    ctx.globalAlpha=1;
  }

  dead(){ return this.life<=0; }
}

// =========================
// SPEED LINES (VISUAL ENGINE)
// =========================

class SpeedLine {
  constructor(){
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.len=rand(20,80);
    this.speed=rand(4,10);
  }

  update(){
    this.x-=this.speed*globalSlowMotion;
    if(this.x<0){
      this.x=W;
      this.y=Math.random()*H;
    }
  }

  draw(){
    if(currentState!==GameState.RUNNING) return;

    ctx.globalAlpha=0.3;
    ctx.strokeStyle="#66aaff";

    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x+this.len,this.y);
    ctx.stroke();

    ctx.globalAlpha=1;
  }
}

for(let i=0;i<50;i++) speedLines.push(new SpeedLine());

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4));
  }
}

// =========================
// MARBLE ENGINE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.vx=0;
    this.base=2.2+Math.random()*1.5;

    this.finished=false;
    this.finishTime=0;

    this.glow=0;
    this.trail=[];
  }

  update(){
    if(currentState!==GameState.RUNNING) return;
    if(this.finished) return;

    const slow = obstacles[this.i]*0.28;
    const target = this.base - slow;

    this.vx += (target-this.vx)*0.08;
    this.x += this.vx*globalSlowMotion;

    this.glow*=0.9;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10) this.trail.shift();

    if(Math.random()<0.01 && obstacles[this.i]>0){
      this.glow=8;
      particles.push(new Particle(this.x,this.y,COLORS[this.i]));
    }

    if(this.x>W-90){
      this.finished=true;
      this.finishTime=performance.now();

      for(let i=0;i<25;i++){
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }

      globalSlowMotion=0.4;
    }
  }

  draw(){
    this.trail.forEach((t,i)=>{
      ctx.globalAlpha=i/this.trail.length*0.4;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,6,6);
    });

    ctx.globalAlpha=1;

    let r=14+this.glow;

    ctx.shadowBlur=15;
    ctx.shadowColor=COLORS[this.i];

    let g=ctx.createRadialGradient(this.x-5,this.y-5,2,this.x,this.y,r);
    g.addColorStop(0,"#fff");
    g.addColorStop(0.3,COLORS[this.i]);
    g.addColorStop(1,"#000");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(this.x,this.y,r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
  }
}

// =========================
// ENGINE
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
}

// =========================
// TRACK
// =========================

function drawTrack(){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0b1220");
  g.addColorStop(1,"#05070c");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){
    let y=120+i*60;

    ctx.strokeStyle="rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    for(let j=0;j<obstacles[i];j++){
      let x=320+j*120;
      ctx.fillStyle="#444";
      ctx.fillRect(x,y-10,22,22);
    }
  }
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";
    b.onclick=()=>selectedMarble=i;
    buttons.appendChild(b);
  });
}

// =========================
// FLOW
// =========================

function startRaceFlow(){
  if(selectedMarble===null){
    status.innerText="Pick marble first";
    return;
  }

  makeObstacles();
  setup();

  currentState=GameState.RUNNING;
  status.innerText="RACING...";
}

// =========================
// LOOP (MASTER ENGINE)
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  drawTrack();

  speedLines.forEach(s=>{
    s.update();
    s.draw();
  });

  marbles.forEach(m=>{
    m.update();
    m.draw();
  });

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.dead()) particles.splice(i,1);
  });

  if(currentState===GameState.RUNNING && marbles.every(m=>m.finished)){
    currentState=GameState.FINISHED;

    let w=[...marbles].sort((a,b)=>a.finishTime-b.finishTime)[0];

    status.innerText=
      "WINNER: "+COLORS[w.i].toUpperCase()+
      " | YOU PICKED: "+COLORS[selectedMarble].toUpperCase();
  }

  requestAnimationFrame(loop);
}

// =========================
// START
// =========================

initUI();
setup();
makeObstacles();
loop();

</script>

</body>
</html>
