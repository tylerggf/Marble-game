<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race PRO+ QR</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div id="ui">
  <h2>Pick Your Marble</h2>
  <div id="buttons"></div>
  <button onclick="startRaceFlow()">START</button>
  <h3 id="status">Scan QR to play</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// QR SESSION SYSTEM
// =========================

const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session");

let usedSessions = JSON.parse(localStorage.getItem("usedSessions") || "{}");

if (!sessionId) {
  document.getElementById("status").innerText = "❌ No QR session detected";
}

if (sessionId && usedSessions[sessionId]) {
  document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:20%'>❌ This QR code has already been used</h1>";
  throw new Error("Session used");
}

// =========================
// CORE
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

// =========================
// STATE
// =========================

let selectedMarble = null;
let marbles = [];
let obstacles = [];
let particles = [];

let state = "waiting";
let winnerLocked = false;

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=50;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/50;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,2,2);
    ctx.globalAlpha=1;
  }

  dead(){ return this.life<=0; }
}

// =========================
// OBSTACLES (SPREAD OUT)
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4));
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.baseSpeed=2.8;
    this.slowTimer=0;

    this.finished=false;
    this.glow=0;

    this.trail=[];
  }

  hitObstacle(){
    this.slowTimer=120; // 2 seconds
    this.glow=10;
    particles.push(new Particle(this.x,this.y,COLORS[this.i]));
  }

  update(){

    if(state!=="running") return;
    if(this.finished) return;

    let speed=this.baseSpeed;

    if(this.slowTimer>0){
      speed*=0.45;
      this.slowTimer--;
      if(this.slowTimer===0) this.glow=0;
    }

    this.x+=speed;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10) this.trail.shift();

    // OBSTACLES (SPREAD OUT)
    for(let j=0;j<obstacles[this.i];j++){
      let ox=380+j*180;

      if(Math.abs(this.x-ox)<10 && this.slowTimer===0){
        this.hitObstacle();
      }
    }

    // WINNER LOCK (NO TIES)
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      this.finished=true;
      state="finished";

      // mark session used
      if(sessionId){
        usedSessions[sessionId]=true;
        localStorage.setItem("usedSessions",JSON.stringify(usedSessions));
      }

      status.innerText =
        "WINNER: "+NAMES[this.i]+
        " | YOU PICKED: "+(selectedMarble!==null?NAMES[selectedMarble]:"None");

      for(let i=0;i<25;i++){
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    }
  }

  draw(){

    this.trail.forEach((t,i)=>{
      ctx.globalAlpha=i/this.trail.length*0.4;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,6,6);
    });

    ctx.globalAlpha=1;

    let r=14+this.glow;

    let g=ctx.createRadialGradient(this.x,this.y,2,this.x,this.y,r);
    g.addColorStop(0,"#fff");
    g.addColorStop(0.3,COLORS[this.i]);
    g.addColorStop(1,"#000");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(this.x,this.y,r,0,Math.PI*2);
    ctx.fill();
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// TRACK
// =========================

function drawTrack(){
  ctx.fillStyle="#05070c";
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){
    let y=120+i*60;

    ctx.strokeStyle="rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    for(let j=0;j<obstacles[i];j++){
      let x=380+j*180;
      ctx.fillStyle="#444";
      ctx.fillRect(x,y-10,22,22);
    }
  }
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";
    b.onclick=()=>{
      selectedMarble=i;
      status.innerText="Selected: "+NAMES[i];
    };
    buttons.appendChild(b);
  });
}

// =========================
// START
// =========================

function startRaceFlow(){

  if(!sessionId){
    status.innerText="❌ Scan QR first";
    return;
  }

  if(usedSessions[sessionId]){
    status.innerText="❌ This QR already used";
    return;
  }

  if(selectedMarble===null){
    status.innerText="Pick marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="GO!";
}

// =========================
// LOOP
// =========================

function loop(){

  drawTrack();

  marbles.forEach(m=>{
    m.update();
    m.draw();
  });

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.dead()) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
makeObstacles();
loop();

</script>

</body>
</html>
