<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race ULTRA</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

/* UI stays at top */
#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 12px;
}
button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE ULTRA</h2>

  <input id="codeInput" placeholder="Enter game code">
  <button onclick="submitCode()">Join</button>

  <div id="buttons"></div>

  <button onclick="startGame()">START</button>

  <h3 id="status">Enter code to play</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// SERVER
// =========================

const SERVER = "https://YOUR-RENDER-URL";

// =========================
// CANVAS
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = [
  "#ff3b3b","#3b7bff","#3bff7a",
  "#ffe93b","#b23bff","#ff8c3b","#ffffff"
];

const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selected = null;
let marbles = [];
let obstacles = [];
let particles = [];
let state = "waiting";
let winnerLocked = false;
let activeCode = null;

// =========================
// CODE SYSTEM (NO ADMIN UI)
// =========================

async function submitCode(){
  const code = document.getElementById("codeInput").value;

  const res = await fetch(SERVER + "/validate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ code })
  });

  const data = await res.json();

  if(!data.valid){
    status.innerText = "❌ " + data.message;
    return;
  }

  activeCode = code;
  status.innerText = "✅ Code accepted";
}

async function useCode(){
  if(!activeCode) return;

  await fetch(SERVER + "/use", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ code: activeCode })
  });
}

// =========================
// PARTICLES
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*3;
    this.vy=(Math.random()-0.5)*3;
    this.life=40;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/40;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,this.y,3,3);
    ctx.globalAlpha=1;
  }
}

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*3)+1);
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.v=2.8;
    this.slow=0;
    this.trail=[];
    this.finished=false;
  }

  update(){

    if(state!=="running") return;
    if(this.finished || winnerLocked) return;

    let speed = this.v;

    if(this.slow>0){
      speed *= 0.4;
      this.slow--;
    }

    this.x += speed;

    // trail
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10) this.trail.shift();

    // obstacles
    for(let j=0;j<obstacles[this.i];j++){
      let ox = 300 + j*200;

      if(Math.abs(this.x-ox)<10 && this.slow===0){
        this.slow = 90;
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    }

    // finish
    if(!winnerLocked && this.x > W-90){

      winnerLocked = true;
      this.finished = true;
      state = "finished";

      status.innerText = "WINNER: " + NAMES[this.i];

      useCode();
    }
  }

  draw(){

    // trail
    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha=i/this.trail.length*0.4;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,5,5);
    }

    ctx.globalAlpha=1;

    // marble glow
    ctx.shadowBlur=15;
    ctx.shadowColor=COLORS[this.i];

    ctx.fillStyle=COLORS[this.i];
    ctx.beginPath();
    ctx.arc(this.x,this.y,14,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// TRACK (NOW CLEAR + VISIBLE)
// =========================

function drawTrack(){

  // background
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0b1220");
  g.addColorStop(1,"#05070c");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){

    let y=120+i*60;

    // lane line
    ctx.strokeStyle="rgba(255,255,255,0.12)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    // lane glow center
    ctx.strokeStyle="rgba(80,150,255,0.05)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    // obstacles (VISIBLE BOXES)
    for(let j=0;j<obstacles[i];j++){
      let x=300 + j*200;

      ctx.fillStyle="#333";
      ctx.fillRect(x,y-10,24,24);

      ctx.strokeStyle="#666";
      ctx.strokeRect(x,y-10,24,24);
    }
  }
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";

    b.onclick=()=>selected=i;

    buttons.appendChild(b);
  });
}

// =========================
// START
// =========================

function startGame(){

  if(!activeCode){
    status.innerText="Enter valid code first!";
    return;
  }

  if(selected===null){
    status.innerText="Pick a marble!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="RACING...";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  drawTrack();

  marbles.forEach(m=>m.update());
  marbles.forEach(m=>m.draw());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
