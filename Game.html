<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race ULTRA</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #0b1020, #05070c);
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.6));
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE ULTRA</h2>

  <input id="codeInput" placeholder="Enter code">
  <button onclick="submitCode()">Join</button>

  <div id="buttons"></div>

  <button onclick="startGame()">START</button>

  <h3 id="status">Enter code</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// SERVER
// =========================

const SERVER = "https://YOUR-RENDER-URL";

// =========================
// CANVAS
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selected = null;
let marbles = [];
let particles = [];
let obstacles = [];
let state = "waiting";
let winnerLocked = false;

let activeCode = null;

// =========================
// PARTICLES (IMPROVED)
// =========================

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*4;
    this.vy=(Math.random()-0.5)*4;
    this.life=60;
    this.color=color;
    this.size=Math.random()*3+1;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vx*=0.96;
    this.vy*=0.96;
    this.life--;
  }

  draw(){
    ctx.globalAlpha=this.life/60;
    ctx.fillStyle=this.color;
    ctx.shadowBlur=10;
    ctx.shadowColor=this.color;

    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  }
}

// =========================
// CODE SYSTEM
// =========================

async function submitCode(){

  const code = document.getElementById("codeInput").value;

  const res = await fetch(SERVER+"/validate",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code})
  });

  const data = await res.json();

  if(!data.valid){
    status.innerText="❌ "+data.message;
    return;
  }

  activeCode = code;
  status.innerText="✅ Code accepted";
}

async function useCode(){
  if(!activeCode) return;

  await fetch(SERVER+"/use",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:activeCode})
  });
}

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4));
  }
}

// =========================
// MARBLE (ULTRA FEEL)
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.v=0;
    this.target=2.8;

    this.slow=0;

    this.r=14;
    this.stretch=1;

    this.trail=[];
  }

  update(){

    if(state!=="running") return;
    if(winnerLocked) return;

    // smooth acceleration
    this.v += (this.target - this.v)*0.08;

    let speed=this.v;

    if(this.slow>0){
      speed*=0.45;
      this.slow--;
      this.stretch=1.3;
    } else {
      this.stretch=1;
    }

    this.x += speed;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>12) this.trail.shift();

    // obstacles
    for(let j=0;j<obstacles[this.i];j++){
      let ox=380+j*180;

      if(Math.abs(this.x-ox)<10 && this.slow===0){
        this.slow=120;
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }
    }

    // WIN
    if(!winnerLocked && this.x>W-90){

      winnerLocked=true;
      state="finished";

      status.innerText="WINNER: "+NAMES[this.i];

      useCode();
    }
  }

  draw(){

    // trail glow
    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha=i/this.trail.length*0.3;
      ctx.fillStyle=COLORS[this.i];
      ctx.fillRect(t.x,t.y,6,6);
    }

    ctx.globalAlpha=1;

    let w=this.r*this.stretch;
    let h=this.r/this.stretch;

    ctx.shadowBlur=20;
    ctx.shadowColor=COLORS[this.i];

    ctx.fillStyle=COLORS[this.i];

    ctx.beginPath();
    ctx.ellipse(this.x,this.y,w,h,0,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// TRACK (PRETTY)
// =========================

function drawTrack(){

  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0c1224");
  g.addColorStop(1,"#05070c");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){

    let y=120+i*60;

    ctx.strokeStyle="rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    ctx.shadowBlur=10;
    ctx.shadowColor=COLORS[i];

    ctx.strokeStyle="rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    ctx.shadowBlur=0;

    for(let j=0;j<obstacles[i];j++){
      let x=380+j*180;
      ctx.fillStyle="#444";
      ctx.fillRect(x,y-10,22,22);
    }
  }
}

// =========================
// GAME FLOW
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";

    b.onclick=()=>selected=i;

    buttons.appendChild(b);
  });
}

function startGame(){

  if(!activeCode){
    status.innerText="Enter code first!";
    return;
  }

  if(selected===null){
    status.innerText="Pick marble!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="GO!";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  drawTrack();

  marbles.forEach(m=>m.update());
  marbles.forEach(m=>m.draw());

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
