<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race PRO+</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: radial-gradient(#0b1220, #05070c);
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

button:hover {
  transform: scale(1.05);
}

canvas {
  display: block;
  margin: auto;
}
</style>
</head>

<body>

<div id="ui">
  <h2>Pick Your Marble</h2>
  <div id="buttons"></div>
  <button onclick="startRace()">START RACE</button>
  <h3 id="status"></h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const LANES = 7;

let selected = null;
let marbles = [];
let obstacles = [];
let particles = [];
let running = false;
let slowMo = 1;

class Particle {
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*2.5;
    this.vy=(Math.random()-0.5)*2.5;
    this.life=50;
    this.color=color;
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.life--;
  }

  draw(){
    ctx.globalAlpha = this.life/50;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x,this.y,2,2);
    ctx.globalAlpha = 1;
  }
}

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.vx=0;
    this.acc=0;
    this.base=2.4+Math.random()*1.2;

    this.finished=false;
    this.finishTime=0;
    this.glow=0;
    this.trail=[];
  }

  update(){
    if(!running || this.finished) return;

    const penalty = obstacles[this.i]*0.28;
    const target = this.base - penalty;

    this.acc = (target - this.vx)*0.08;
    this.vx += this.acc;
    this.x += this.vx * slowMo;

    // trail
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length > 8) this.trail.shift();

    this.glow *= 0.92;

    if(this.x >= W-90){
      this.finished = true;
      this.finishTime = performance.now();

      for(let i=0;i<20;i++){
        particles.push(new Particle(this.x,this.y,COLORS[this.i]));
      }

      slowMo = 0.4; // slow motion finish effect
    }

    if(Math.random() < 0.015 && obstacles[this.i] > 0){
      this.glow = 10;
      particles.push(new Particle(this.x,this.y,COLORS[this.i]));
    }
  }

  draw(){
    // trail
    for(let i=0;i<this.trail.length;i++){
      let t=this.trail[i];
      ctx.globalAlpha = i/this.trail.length*0.5;
      ctx.fillStyle = COLORS[this.i];
      ctx.beginPath();
      ctx.arc(t.x,t.y,8,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    let r = 14 + this.glow;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.arc(this.x+3,this.y+3,r,0,Math.PI*2);
    ctx.fill();

    // glow ring
    ctx.shadowBlur = 15;
    ctx.shadowColor = COLORS[this.i];

    // marble body (3D-ish)
    let g = ctx.createRadialGradient(
      this.x-6,this.y-6,2,
      this.x,this.y,r
    );

    g.addColorStop(0,"#fff");
    g.addColorStop(0.25,COLORS[this.i]);
    g.addColorStop(1,"#000");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x,this.y,r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4)); // 0–3
  }
}

function drawTrack(){
  // gradient background
  let bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#0c1424");
  bg.addColorStop(1,"#05070c");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<LANES;i++){
    let y=120+i*60;

    // lane line glow
    ctx.strokeStyle = COLORS[i];
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

    ctx.globalAlpha = 1;

    // obstacles
    for(let j=0;j<obstacles[i];j++){
      let x = 320 + j*120;

      ctx.fillStyle = "#444";
      ctx.fillRect(x,y-10,22,22);

      ctx.strokeStyle = COLORS[i];
      ctx.strokeRect(x,y-10,22,22);
    }
  }
}

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
}

function animate(){
  ctx.clearRect(0,0,W,H);

  drawTrack();

  marbles.forEach(m=>{
    m.update();
    m.draw();
  });

  particles.forEach((p,i)=>{
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  });

  if(running && marbles.every(m=>m.finished)){
    running=false;

    let winner = [...marbles].sort((a,b)=>a.finishTime-b.finishTime)[0];

    document.getElementById("status").innerText =
      "WINNER: " + COLORS[winner.i].toUpperCase() +
      " | YOU PICKED: " + (selected!==null ? COLORS[selected].toUpperCase() : "NONE");

    slowMo = 1;
  }

  requestAnimationFrame(animate);
}

function startRace(){
  if(selected === null){
    alert("Pick a marble first");
    return;
  }

  makeObstacles();
  setup();
  running = true;
  slowMo = 1;

  document.getElementById("status").innerText = "RACING...";
}

function pick(i){
  selected = i;
  document.getElementById("status").innerText =
    "SELECTED: " + COLORS[i].toUpperCase();
}

// UI
const btn=document.getElementById("buttons");
COLORS.forEach((c,i)=>{
  let b=document.createElement("button");
  b.style.background=c;
  b.innerText=" ";
  b.style.width="30px";
  b.style.height="30px";
  b.onclick=()=>pick(i);
  btn.appendChild(b);
});

setup();
animate();
</script>

</body>
</html>
