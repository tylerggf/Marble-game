<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marble Race PRO ONLINE</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  font-family: Arial;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  margin: 4px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h2>MARBLE RACE ONLINE</h2>

  <input id="codeInput" placeholder="Enter game code">
  <button onclick="submitCode()">Join</button>

  <div id="buttons"></div>

  <button onclick="startRace()">START</button>
  <button onclick="generateCode()">ADMIN: Generate Code</button>

  <h3 id="status">Enter Code</h3>
</div>

<canvas id="c" width="1000" height="600"></canvas>

<script>

// =========================
// CORE
// =========================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;

const LANES = 7;

const COLORS = ["#ff3b3b","#3b7bff","#3bff7a","#ffe93b","#b23bff","#ff8c3b","#ffffff"];
const NAMES = ["Red","Blue","Green","Yellow","Purple","Orange","White"];

let selected = null;
let marbles = [];
let obstacles = [];
let state = "waiting";
let winnerLocked = false;

let activeCode = null;

// =========================
// SERVER URL
// =========================

const SERVER = "https://YOUR-RENDER-URL";

// =========================
// CODE SYSTEM
// =========================

// ADMIN: generate code from server
async function generateCode() {
  const res = await fetch(SERVER + "/generate", {
    method: "POST"
  });

  const data = await res.json();

  alert("GAME CODE: " + data.code);
}

// PLAYER: validate code
async function submitCode() {

  const input = document.getElementById("codeInput").value;

  const res = await fetch(SERVER + "/validate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ code: input })
  });

  const data = await res.json();

  if (!data.valid) {
    status.innerText = "❌ " + data.message;
    return;
  }

  activeCode = input;
  status.innerText = "✅ Code accepted";
}

// consume code (one-time use)
async function useCode(code) {
  await fetch(SERVER + "/use", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ code })
  });
}

// =========================
// OBSTACLES
// =========================

function makeObstacles(){
  obstacles=[];
  for(let i=0;i<LANES;i++){
    obstacles.push(Math.floor(Math.random()*4));
  }
}

// =========================
// MARBLE
// =========================

class Marble {
  constructor(i){
    this.i=i;
    this.x=60;
    this.y=120+i*60;

    this.baseSpeed=2.8;
    this.slowTimer=0;

    this.finished=false;
  }

  update(){

    if(state!=="running") return;
    if(this.finished) return;

    let speed=this.baseSpeed;

    if(this.slowTimer>0){
      speed*=0.45;
      this.slowTimer--;
    }

    this.x+=speed;

    // obstacles
    for(let j=0;j<obstacles[this.i];j++){
      let ox=380+j*180;

      if(Math.abs(this.x-ox)<10 && this.slowTimer===0){
        this.slowTimer=120;
      }
    }

    // WIN
    if(!winnerLocked && this.x > W-90){

      winnerLocked = true;
      this.finished = true;
      state = "finished";

      status.innerText = "WINNER: " + NAMES[this.i];

      // 🔥 consume code on win
      if(activeCode){
        useCode(activeCode);
      }
    }
  }

  draw(){
    ctx.fillStyle = COLORS[this.i];
    ctx.beginPath();
    ctx.arc(this.x,this.y,14,0,Math.PI*2);
    ctx.fill();
  }
}

// =========================
// SETUP
// =========================

function setup(){
  marbles=[];
  for(let i=0;i<LANES;i++){
    marbles.push(new Marble(i));
  }
  winnerLocked=false;
}

// =========================
// UI
// =========================

const status=document.getElementById("status");
const buttons=document.getElementById("buttons");

function initUI(){
  buttons.innerHTML="";

  COLORS.forEach((c,i)=>{
    let b=document.createElement("button");
    b.style.background=c;
    b.style.width="30px";
    b.style.height="30px";

    b.onclick=()=>selected=i;

    buttons.appendChild(b);
  });
}

// =========================
// START GAME
// =========================

function startRace(){

  if(!activeCode){
    status.innerText="Enter valid code first!";
    return;
  }

  if(selected===null){
    status.innerText="Pick marble first!";
    return;
  }

  makeObstacles();
  setup();

  state="running";
  status.innerText="GO!";
}

// =========================
// LOOP
// =========================

function loop(){

  ctx.clearRect(0,0,W,H);

  marbles.forEach(m=>{
    m.update();
    m.draw();
  });

  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================

initUI();
setup();
loop();

</script>

</body>
</html>
